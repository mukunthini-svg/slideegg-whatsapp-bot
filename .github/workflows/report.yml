name: SlideEgg weekly email

# One email a week, Monday morning, listing what went out. Nothing else.
#
# The daily summary used to run here too and was removed on purpose: a mail
# every evening saying "3 posts today" is noise once the channel is running
# by itself. Problems do not wait for this schedule either — the posting
# workflow sends its own alert the moment something breaks.

on:
  schedule:
    # Monday 09:00 IST (03:30 UTC)
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      kind:
        description: "Which email to send by hand"
        type: choice
        options: ["weekly", "alert", "daily"]
        default: "weekly"
      preview:
        description: "preview = build it but do NOT send"
        type: choice
        options: ["send", "preview"]
        default: "send"

permissions:
  contents: read

concurrency:
  group: slideegg-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decide which email this run is
        id: which
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "kind=${{ inputs.kind }}" >> $GITHUB_OUTPUT
          else
            echo "kind=weekly" >> $GITHUB_OUTPUT
          fi

      - name: Send the email
        env:
          # Brevo is the primary route: Gmail App Passwords are blocked on
          # Google Workspace accounts unless the domain admin enables them.
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          # No MAIL_TO on purpose. report.py addresses admin@slideegg.com and
          # only that, which is checkable in the source; a MAIL_TO secret could
          # be quietly pointing somewhere else and nobody would see it.
          SHEET_URL: ${{ secrets.SHEET_URL }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python report.py --${{ steps.which.outputs.kind }} \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.preview == 'preview') && '--dry-run' || '' }}

      - name: Upload preview
        if: always() && github.event_name == 'workflow_dispatch' && inputs.preview == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: email-preview
          path: report_preview.html
          if-no-files-found: ignore
