name: SlideEgg auto-post to WhatsApp Channel

on:
  schedule:
    # Hourly. Each run opens a WhatsApp connection from whichever GitHub runner
    # picks up the job, so the IP changes every time; a real linked device does
    # not reconnect every 15 minutes from a new address, and that pattern is
    # what gets numbers flagged. Hourly keeps posts prompt without looking
    # automated. Volume is capped by DAILY_LIMIT below, not by the schedule.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "live = really post to WhatsApp | dry = preview only"
        type: choice
        options: ["live", "dry"]
        default: "live"
      sources:
        description: "What to watch"
        type: choice
        options: ["templates,blog", "templates", "blog"]
        default: "templates,blog"
      max_posts:
        description: "Max posts in this run"
        default: "8"
      force:
        description: "Ignore quiet hours (type: yes)"
        default: "no"

permissions:
  contents: write

# Never let two runs post at the same time — that is how duplicates happen.
concurrency:
  group: slideegg-autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install the WhatsApp sender
        working-directory: baileys
        run: npm ci

      - name: Run poster
        env:
          # Transport. "baileys" is the free self-hosted route and needs
          # WA_SESSION_KEY plus a session paired by the Pair workflow.
          # "whapi" is the old paid API and needs WHAPI_TOKEN.
          SENDER: ${{ vars.SENDER || 'baileys' }}
          WA_SESSION_KEY: ${{ secrets.WA_SESSION_KEY }}
          WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
          WHAPI_CHANNEL: ${{ secrets.WHAPI_CHANNEL }}
          # A choice input arrives as a plain string, which avoids the
          # boolean-checkbox ambiguity that made manual runs silently dry.
          DRY_RUN: ${{ inputs.mode == 'dry' && '1' || '0' }}
          SOURCES: ${{ inputs.sources || 'templates,blog' }}
          # Per-run cap. Under it sits DAILY_LIMIT, the real ceiling.
          MAX_POSTS: ${{ inputs.max_posts || '8' }}
          SCAN_PAGES: "3"
          MAX_AGE_DAYS: "14"
          ACTIVE_FROM: "0"      # 0/24 = post round the clock
          ACTIVE_TO: "24"
          DAILY_LIMIT: "8"      # hard ceiling on posts per IST day
          # If nothing new is detected for this many hours the run is failed
          # on purpose, which turns the run red and emails the repo owner.
          # Posting happens before this check, so it can never block a good run.
          ALERT_AFTER_HOURS: "24"
        run: |
          python slideegg_daily.py ${{ inputs.force == 'yes' && '--force' || '' }}

      - name: Commit state
        if: always()
        run: |
          git config user.name  "slideegg-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          if git diff --staged --quiet; then
            echo "no state change"
          else
            git commit -m "state: $(date -u +'%Y-%m-%d %H:%M') UTC"
            # another run may have pushed while we worked
            git pull --rebase --autostash || true
            git push
          fi

      - name: Run summary
        if: always()
        run: |
          echo '### SlideEgg auto-post' >> $GITHUB_STEP_SUMMARY
          if [ -f state/last_run.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat state/last_run.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo 'No run record (quiet hours, or the run exited early).' >> $GITHUB_STEP_SUMMARY
          fi
